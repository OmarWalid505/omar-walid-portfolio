
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Omar Walid's programming and multimedia projects.">
  <title>Projects | OMAR WALID</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">OMAR <span>WALID</span></a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button>

    <nav id="nav">
      <a href="index.html">Home</a>
      <a href="index.html#specialties">Specializations</a>
      <a class="active" href="projects.html">Projects</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>

    <button class="icon-button" id="themeToggle" aria-label="Toggle theme">◐</button>
  </header>

  <main>
    <section class="section-wrap projects" id="projects">

      <div class="section-heading">
        <div>
          <p class="eyebrow"><i></i> MY PORTFOLIO</p>
          <h2>Selected Works</h2>
        </div>

        <div class="project-tools">
          <p class="section-note">Explore my programming and multimedia projects.</p>

          <div class="filters" role="group" aria-label="Filter projects">
            <button class="filter active" data-filter="All">All</button>
            <button class="filter" data-filter="Programming">Programming</button>
            <button class="filter" data-filter="Video Editing">Video Editing</button>
            <button class="filter" data-filter="Graphic Design">Graphic Design</button>
          </div>
        </div>
      </div>

      <div class="project-grid" id="projectGrid"></div>

    </section>
  </main>

  <footer>
    <a class="logo" href="index.html">OMAR <span>WALID</span></a>
    <p>© <span id="year"></span> Omar Walid. All rights reserved.</p>
    <a href="#">Back to top ↑</a>
  </footer>

  <dialog id="projectDialog" class="project-dialog">
    <button class="dialog-close" id="dialogClose" aria-label="Close">×</button>
    <p class="eyebrow">PROJECT DETAILS</p>
    <h2 id="dialogTitle"></h2>
    <p id="dialogDescription"></p>
    <p class="dialog-tools" id="dialogTools"></p>
  </dialog>

  <dialog id="imageViewer" class="image-viewer">
    <button class="image-viewer-close" id="imageViewerClose">×</button>
    <button class="gallery-arrow prev" id="prevImage">‹</button>
    <img id="viewerImage" src="" alt="Project Image">
    <video id="viewerVideo" controls playsinline hidden></video>
    <button class="gallery-arrow next" id="nextImage">›</button>
    <p id="imageCounter"></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="projects.js"></script>

</body>
</html>
