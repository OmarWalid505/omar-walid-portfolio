<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    [hidden] {
      display: none !important;
    }

    .admin-container {
      max-width: 700px;
      margin: auto;
    }

    .admin-form {
      display: grid;
      gap: 15px;
      margin-top: 25px;
    }

    input, textarea, select, button {
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

  <main class="admin-container">
    <h1>لوحة التحكم</h1>
    <p>إدارة مشاريع Portfolio</p>

    <form class="admin-form" id="loginForm">
      <h2>تسجيل دخول المدير</h2>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">تسجيل الدخول</button>
      <p id="loginMessage"></p>
    </form>

    <section id="dashboard" hidden>
      <h2>إضافة مشروع جديد</h2>

      <form class="admin-form" id="projectForm">
        <input type="text" id="title" placeholder="اسم المشروع" required>

        <textarea id="description" placeholder="وصف المشروع"></textarea>

        <select id="category" required>
          <option value="">اختر التخصص</option>
          <option value="Programming">Programming</option>
          <option value="Video Editing">Video Editing</option>
          <option value="Graphic Design">Graphic Design</option>
        </select>

        <input type="text" id="tools" placeholder="البرامج والأدوات المستخدمة">

        <label>صورة المشروع</label>
        <input type="file" id="image" accept="image/*">

        <label>فيديو المشروع</label>
        <input type="file" id="video" accept="video/*">

        <input type="url" id="projectUrl" placeholder="رابط المشروع (اختياري)">

        <button type="submit">إضافة المشروع</button>
        <p id="projectMessage"></p>
      </form>

      <h2>المشاريع الحالية</h2>
      <div id="projectsList"></div>

      <button type="button" id="logoutButton">تسجيل الخروج</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
